<div class="language-selector">
  @for (lang of i18nService.availableLanguages; track $index) {
    <label>
      <input
        type="radio"
        name="language"
        [value]="lang.code"
        [(ngModel)]="selectedLanguage"
        (ngModelChange)="onLanguageChange(lang.code)" />
      {{ lang.label }}
    </label>
  }
</div>
