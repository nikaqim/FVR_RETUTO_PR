<div 
  [ngClass]="'custom-btn ' + btnSetting.size" 
  (click)="buttonClicked(btnSetting.action)"
  [ngStyle]="{
    'position': 'relative',
    'top': btnSetting.offset !== undefined? btnSetting.offset.y + 'px' : 'unset',
    'right': btnSetting.offset !== undefined? btnSetting.offset.x + 'px' : 'unset',
  }">
     <div class="btn-wrapper">

      <svg *ngIf="btnSetting.progress !== undefined && btnSetting.progress" class="ring" viewBox="0 0 100 100">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
          </filter>

          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="70%" stop-color="#7b2f47" stop-opacity="0.57"/>
          </linearGradient>

          <linearGradient id="ringGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f96c8f" stop-opacity="1"/>
            <stop offset="30%" stop-color="#fd487b" stop-opacity="1"/>
          </linearGradient>
        </defs>
      
        <circle
          class="ring-bg"
          cx="50"
          cy="50"
          r="45"
          fill="none"
          stroke="rgba(255, 255, 255, 0.1)"
          stroke-width="8"
        />
        
        <!-- backgroun empty -->
        <circle
          class="ring-progress"
          cx="50"
          cy="50"
          r="45"
          fill="none"
          stroke="url(#ringGradient)"
          stroke-width="8"
          stroke-dasharray="100" 
          stroke-dashoffset="00" 
          pathLength="100"   
          stroke-linecap="round"
          filter="url(#glow)"
        />

        <!-- progress -->
        <circle
          class="ring-progress"
          cx="50"
          cy="50"
          r="45"
          fill="none"
          pathLength="100"
          stroke="url(#ringGradient2)"
          stroke-width="8"
          stroke-dasharray="100" 
          [attr.stroke-dashoffset]="getProgressOffset(btnSetting.progressPercentage)"    
          stroke-linecap="round"
        />
      </svg>
      
        <div class="button-content">
            <div *ngIf="btnSetting.onNotification" class="notification-flag"></div>
            <lib-bubble-btn 
                [id]="screenId !== 'mob' ? (screenId.replace(' ','') + btnSetting.id).toLowerCase() : btnSetting.id" 
                variant='primary'>
                <mat-icon *ngIf="btnSetting.maticon && !btnSetting.icon">{{btnSetting.maticon}}</mat-icon>
                <img class="icon" *ngIf="btnSetting.icon" [src]="btnSetting.icon" alt="icon" />
                <span class="title" *ngIf="btnSetting.title">
                  {{ btnSetting.title}}
                </span>
            </lib-bubble-btn> 
        </div>
    </div>
     
    <span *ngIf="!btnSetting.hideTitle">
      {{ getTranslatedLabel(btnSetting.label) }}
    </span>
</div>
